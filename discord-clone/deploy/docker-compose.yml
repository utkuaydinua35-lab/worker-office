# Hasbihal on the store server, next to the store. See DEPLOY.md.
#
# Touches nothing of the store's: opens no public port (HTTPS is the
# Cloudflare tunnel's; 80/443 stay nginx's), needs no firewall change, and
# leaves 5432 alone. Voice and video run on LiveKit Cloud. Containers sit on
# their own bridge network, so they can't reach services the store binds to
# the host's loopback.
name: hasbihal

services:
  db:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: hasbihal
      POSTGRES_DB: hasbihal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    # Loopback only, and not the store's 5432. The app uses db:5432 inside the
    # network; this is for backups and psql from the server.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hasbihal"]
      interval: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The tunnel's route is http://localhost:3000.
    ports:
      - "127.0.0.1:3000:3000"
    # Keep the store's share of the machine.
    mem_limit: 700m
    cpus: 2
    environment:
      PORT: "3000"
      # Collect garbage before the 700m limit kills the container.
      NODE_OPTIONS: --max-old-space-size=448
      DATABASE_URL: postgresql://hasbihal:${POSTGRES_PASSWORD}@db:5432/hasbihal?schema=public
      NEXTAUTH_URL: https://${DOMAIN:?}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      NEXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL (wss://...livekit.cloud) in deploy/.env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
    volumes:
      - uploads:/app/uploads
    # Defense in depth: no privilege escalation, no Linux capabilities.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  db-data:
  uploads:

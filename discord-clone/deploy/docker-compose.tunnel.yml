# Hasbihal behind a Cloudflare Tunnel, with LiveKit Cloud for voice.
# See DEPLOY.md, "Cloudflare Tunnel ile".
#
# For a VPS that already runs other things: this opens no public port and
# needs no firewall change. Postgres is reachable only by the app (compose
# network, nothing published); the app is published on the host's loopback
# only, where cloudflared picks it up. HTTPS is Cloudflare's; voice and video
# go to LiveKit Cloud, since a tunnel can't carry WebRTC's UDP.
name: hasbihal

services:
  db:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: hasbihal
      POSTGRES_DB: hasbihal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hasbihal"]
      interval: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://hasbihal:${POSTGRES_PASSWORD}@db:5432/hasbihal?schema=public
      NEXTAUTH_URL: https://${DOMAIN:?}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      NEXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL (wss://...livekit.cloud) in deploy/.env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
    volumes:
      - uploads:/app/uploads
    # Defense in depth: no privilege escalation, no Linux capabilities.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  db-data:
  uploads:

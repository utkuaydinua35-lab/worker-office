# Hasbihal — single-server deployment. See DEPLOY.md.
#
# Everything uses host networking (Linux) so the internal services can bind
# to 127.0.0.1 only: Postgres, the app (3000) and LiveKit's API (7880) are
# unreachable from outside. Public: Caddy (80/443) and LiveKit's media ports
# (7881/tcp, 50000-50100/udp).
name: hasbihal

services:
  db:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: hasbihal
      POSTGRES_DB: hasbihal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "hasbihal"]
      interval: 5s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      PORT: "3000"
      BIND_HOST: 127.0.0.1
      DATABASE_URL: postgresql://hasbihal:${POSTGRES_PASSWORD}@127.0.0.1:5432/hasbihal?schema=public
      NEXTAUTH_URL: https://${DOMAIN:?}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      NEXT_PUBLIC_LIVEKIT_URL: wss://${DOMAIN}
      LIVEKIT_INTERNAL_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
    volumes:
      - uploads:/app/uploads
    # Defense in depth: no privilege escalation, no Linux capabilities.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
